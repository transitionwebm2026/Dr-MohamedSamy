name: Build and deploy static export to Hostinger

# Four ways this runs:
# 1. Push to main — every merged code change redeploys.
# 2. Manual "Run workflow" button in the GitHub Actions tab.
# 3. repository_dispatch (type: cms-content-updated) — a Supabase Database
#    Webhook can call this for a near-instant rebuild on a dashboard edit,
#    if one's configured. See docs/static-export-deploy.md.
# 4. schedule (every 10 minutes) — the reliable path, independent of the
#    webhook above. Guarantees a dashboard edit is live within 10 minutes
#    even if no webhook is wired up (or one is temporarily broken), with no
#    extra setup. Rebuilding when nothing changed is a harmless no-op, just
#    a minute of CI time.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [cms-content-updated]
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Deploy ./out to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          # Hostinger's static-site document root for most shared plans —
          # adjust if your hPanel shows a different path.
          server-dir: ./public_html/
          # Next.js names each build's _next/static/<hash>/ folder randomly,
          # so every deploy needs the previous one's hash folder removed. An
          # earlier failed run (FTPS data-channel reset mid-transfer) left the
          # action's own server-side state file out of sync with what's
          # actually there, which made incremental cleanup fail with "550 No
          # such file" for a folder that was already gone. Wiping the server
          # first sidesteps that whole class of drift — the site is a few MB,
          # so re-uploading everything each time costs a bit of deploy time,
          # not correctness.
          dangerous-clean-slate: true
